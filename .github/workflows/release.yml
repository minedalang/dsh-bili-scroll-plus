name: GitHub Release (Dafeiyu Life)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify tag matches package version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")" || {
            echo 'Git tag must equal v<package.json version>' >&2
            exit 1
          }
          test "$(node -p "require('./package.json').name")" = 'dsh-dafeiyu-life'
      - name: Syntax checks
        run: |
          node --check index.js
          node --check client.js
          node --check selfcheck.mjs
      - name: Pack installable npm archive
        run: npm pack --ignore-scripts
      - name: Publish Dafeiyu Life GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-dafeiyu-life-*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
